<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.2/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.min.js"></script>

    
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="utf-8" />

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
            }
        }
    </script>

  </head>
  <body>
    <main>
      <div id = "dataContainer" data-day="January 1" data-userChange="none"></div>

      <form id = "daySelection">
        <p>Skip to:</p>
        <select name="monthInput">
          <option value = "January ">January</option>
          <option value = "February ">February</option>
          <option value = "March ">March</option>
          <option value = "April ">April</option>
          <option value = "May ">May</option>
          <option value = "June ">June</option>
          <option value = "July ">July</option>
          <option value = "August ">August</option>
          <option value = "September ">September</option>
          <option value = "October ">October</option>
          <option value = "November ">November</option>
          <option value = "December ">December</option>
        </select>
        <input type = "number" name="dayInput" min="1" max="31" value="1">
        <br><br>
        <input type = "submit" value="Submit">
      </form>
    </main>

    <canvas id="p5Canvas"></canvas>

    <script src="sketch.js"></script>
    <script type="module" src="scene.js"></script>

  </body>
</html>
