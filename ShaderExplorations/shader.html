<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.min.js"></script>
     
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="utf-8" />

  </head>

  <body>
    <main>
      <div id = "controls">
        <h1>Outliner</h1>

        <h3>Get an outline of an image! <br><br>
          This could be used to turn pictures 
          into coloring book pages :)
        </h3>

        <br><br>

        <label>
          Line Weight: <br><br>
          <input id="weightSlider" type="range" min="0.001" max="0.01" value="0.005" step="0.001">
        </label>

        <br><br><br>

        <label>
          Sensitivity: <br><br>
          <input id="sensitivitySlider" type="range" min="0.1" max="0.9" value="0.33" step="0.01">
        </label>

        <br><br><br> 

        <label>
          Invert Colors: 
          <input id="invertBox" type="checkbox">
        </label>

      </div>

      <p id="uploadText">Try Your Own Image!</p>
      
    </main>
    <script src="sketch.js"></script>
  </body>
</html>
